<!doctype html>
<html lang="es-MX">

    <style>
      html,body{min-width:320px;min-height:100%;margin:0;background:#090b14;color:#f7f6fc;color-scheme:dark;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #root{min-height:100vh}
      .initial-loading{min-height:100vh;box-sizing:border-box;background:radial-gradient(ellipse at 78% 0%,rgba(120,68,226,.17),transparent 43%),#090b14;color:#f7f6fc}

      .initial-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:-.04em}
      .initial-brand-public{display:none}html[data-public-shell="true"] .initial-brand-internal{display:none}html[data-public-shell="true"] .initial-brand-public{display:flex}
      .initial-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#a36bff,#7033df);font-weight:800}
      .initial-top-actions{display:flex;align-items:center;gap:9px}
      .initial-content{width:min(1240px,100%);margin:0 auto;padding:24px 22px 48px}
      .initial-note{height:42px;display:flex;align-items:center;gap:12px;padding:0 14px;margin-bottom:16px;border:1px solid rgba(176,137,255,.24);border-radius:13px;background:rgba(123,78,210,.08)}
      .initial-hero{position:relative;display:grid;align-content:space-between;min-height:226px;padding:24px 28px;border:1px solid rgba(190,151,255,.27);border-radius:25px;background:radial-gradient(ellipse at 84% 0%,rgba(126,73,221,.24),transparent 42%),linear-gradient(125deg,#211635,#131320 73%);overflow:hidden}
      .initial-hero-top{display:flex;justify-content:space-between;align-items:start}
      .initial-amount{width:150px;height:42px;margin-top:12px;border-radius:10px}
      .initial-action-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:20px}
      .initial-market{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr) auto;align-items:center;gap:16px;min-height:60px;padding:8px 15px;margin:14px 0 20px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(21,22,32,.8)}

      .initial-market-separator{height:34px;background:rgba(255,255,255,.1)}
      .initial-section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 0 12px}
      .initial-section-head .initial-skeleton{height:17px;width:210px}
      .initial-card-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;border:1px solid rgba(255,255,255,.055);border-radius:22px;background:rgba(15,16,25,.74)}
      .initial-card{height:132px;border-radius:18px}
      .initial-explore{height:70px;margin-top:10px;border-radius:16px}
      .initial-status{display:flex;align-items:center;gap:9px;max-width:1240px;margin:14px auto 0;padding:0 22px;color:#c9c2d9;font-size:13px}
      .initial-skeleton{position:relative;display:block;overflow:hidden;border:1px solid rgba(255,255,255,.065);background:linear-gradient(110deg,#20212e 12%,#292a39 31%,#20212e 52%);background-size:240% 100%;animation:initial-wave 1.55s ease-in-out infinite}
      .initial-line{height:12px;width:100%;border-radius:999px}.initial-pill{height:36px;width:82px;border-radius:999px}.initial-icon{height:38px;width:38px;border-radius:13px}.initial-skeleton-short{width:64%}.initial-skeleton-mid{width:78%}
      @keyframes initial-wave{0%{background-position:100% 50%}100%{background-position:-140% 50%}}
      @media(max-width:760px){.initial-topbar{height:60px;padding:0 14px}.initial-top-actions .initial-icon{display:none}.initial-content{padding:17px 14px 34px}.initial-market{grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:9px}.initial-market-status{display:none}.initial-card{height:112px}}
      @media(max-width:480px){.initial-hero{min-height:190px;padding:20px 17px;border-radius:20px}.initial-action-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.initial-action-row .initial-pill{width:100%;height:46px;border-radius:14px}.initial-market{min-height:55px;padding:8px}.initial-coin .initial-icon{width:30px;height:30px}.initial-card-grid{gap:9px;padding:9px}.initial-card{height:100px}.initial-status{padding:0 14px}}
      .initial-template{display:none}
      html[data-boot-kind="home"] .initial-home,html[data-boot-kind="miner"] .initial-home,html[data-boot-kind="wallet"] .initial-wallet,html[data-boot-kind="data"] .initial-data,html[data-boot-kind="catalog"] .initial-catalog,html[data-boot-kind="table"] .initial-table,html[data-boot-kind="generic"] .initial-generic{display:block}
      .initial-route-heading{display:grid;gap:10px;margin:10px 0 20px}.initial-route-heading .initial-line:nth-child(1){width:110px;height:9px}.initial-route-heading .initial-line:nth-child(2){width:min(310px,65vw);height:29px}.initial-route-heading .initial-line:nth-child(3){width:min(460px,82vw)}
      .initial-panel{padding:18px;margin:14px 0;border:1px solid rgba(255,255,255,.075);border-radius:19px;background:rgba(19,20,31,.84)}
      .initial-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.initial-panel-head .initial-line{width:190px}.initial-mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.initial-mini-card{height:76px;border-radius:14px}.initial-chart{height:178px;margin-top:14px;border-radius:15px}
      .initial-wallet-row{display:grid;grid-template-columns:38px minmax(0,1fr) 96px;align-items:center;gap:13px;padding:15px;margin:9px 0;border:1px solid rgba(255,255,255,.07);border-radius:16px;background:rgba(255,255,255,.025)}.initial-wallet-copy{display:grid;gap:9px}.initial-wallet-copy .initial-line:first-child{width:50%}.initial-wallet-copy .initial-line:last-child{width:82%}
      .initial-product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.initial-product-card{height:212px;padding:14px;border-radius:17px}.initial-product-art{height:104px;margin-bottom:14px;border-radius:13px}.initial-product-title{width:72%;margin-bottom:10px}.initial-product-copy{width:88%;margin-bottom:8px}
      .initial-table-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:center;height:48px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.055)}.initial-table-row .initial-line:nth-child(2){width:68%}.initial-table-row .initial-line:nth-child(3){width:78%}.initial-table-row .initial-line:nth-child(4){width:56%}
      .initial-miner-overlay{display:none;position:fixed;z-index:10;inset:0;place-items:center;overflow:auto;padding:16px;background:rgba(3,4,10,.78);backdrop-filter:blur(10px)}html[data-boot-kind="miner"] .initial-miner-overlay{display:grid}
      .initial-miner-modal{width:min(760px,100%);display:grid;gap:14px;padding:clamp(18px,4vw,28px);border:1px solid rgba(190,151,255,.25);border-radius:22px;background:linear-gradient(145deg,#191a28,#11121c);box-shadow:0 28px 100px rgba(0,0,0,.45)}.initial-plan-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.initial-plan-card{height:76px;border-radius:13px}.initial-modal-total{height:60px;border-radius:12px}
      @media(max-width:760px){.initial-mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.initial-product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.initial-wallet-row{grid-template-columns:32px minmax(0,1fr)}.initial-wallet-row>.initial-pill{display:none}}
      @media(max-width:480px){.initial-content{padding-top:17px}.initial-panel{padding:14px}.initial-mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.initial-product-grid{grid-template-columns:1fr}.initial-product-card{height:180px}.initial-table-row{grid-template-columns:repeat(3,minmax(0,1fr))}.initial-table-row .initial-line:nth-child(n+4){display:none}.initial-miner-overlay{place-items:start center}.initial-miner-modal{margin:auto 0;border-radius:19px}}
      @media(prefers-reduced-motion:reduce){.initial-skeleton{animation:none}}
    </style>
    <script>
      (() => {
        const path = window.location.pathname;
        const query = new URLSearchParams(window.location.search);
        const publicShell = path === '/' || path === '/mining-calculator' || path === '/academy' || path.startsWith('/academy/');
        let kind = 'generic';
        if (path === '/home' && query.get('modal') === 'paywall-create') kind = 'miner';
        else if (path === '/home') kind = 'home';
        else if (path === '/gmt-wallets' || (path.startsWith('/finance/wallets') && !path.includes('/transactions'))) kind = 'wallet';
        else if (path.startsWith('/data-centers') || path === '/operator-economics') kind = 'data';
        else if (path.includes('/transactions') || path.includes('/leaderboard') || path.includes('/rewards') || path.includes('/friends') || path.includes('/overview') || path.includes('/ve-voting') || path.includes('/ve-my-lock')) kind = 'table';
        else if (['/marketplace','/gominers-collection','/travel','/shop','/launchpad','/buy','/buy/GOMINING','/liquidity','/ve-tokenomics','/finance/simple-earn','/finance/instant-funds','/finance/banking-cards','/promos','/raffles','/offers','/goboxes','/bonus-miner-v3','/subscriptions','/academy'].includes(path)) kind = 'catalog';
        document.documentElement.dataset.bootKind = kind;
        document.documentElement.dataset.publicShell = publicShell ? 'true' : 'false';
        if (publicShell) {
          document.title = 'PouwMiner.com · experiencia pública';
          document.getElementById('page-description').setAttribute('content', 'PouwMiner.com · PEARL Research Lab · experiencia pública.');
        }
      })();
    </script>
